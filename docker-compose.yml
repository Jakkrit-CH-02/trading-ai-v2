name: softtrade

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: softtrade
      POSTGRES_USER: ${POSTGRES_USER:-softtrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-softtrade}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-softtrade} -d softtrade"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-softtrade}:${POSTGRES_PASSWORD:-softtrade}@postgres:5432/softtrade
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }

  market-data:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "services.market_data"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-softtrade}:${POSTGRES_PASSWORD:-softtrade}@postgres:5432/softtrade
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-softtrade}:${POSTGRES_PASSWORD:-softtrade}@postgres:5432/softtrade
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-dev}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      MASTER_KEY: ${MASTER_KEY:-}
      BINANCE_TRADING_ENV: ${BINANCE_TRADING_ENV:-demo}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3005}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
