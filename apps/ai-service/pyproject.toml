[project]
name = "ai-service"
version = "0.1.0"
description = "AI service for the Binance trading bot — datasets, features, training, inference."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "polars>=1.12",
    "joblib>=1.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
